services:
  webgateway:
    image: registry.cn-chengdu.aliyuncs.com/pzl_devops/webgateway:v1.0.0
    container_name: webgateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8234:8234"
    environment:
      TZ: "Asia/Shanghai"
      INITIAL_ADMIN_EMAIL: "webgateway"
      INITIAL_ADMIN_PASSWORD: "REPLACE_WITH_A_STRONG_PASSWORD"
      LETSENCRYPT_EMAIL: "admin@example.com"
      DB_SQLITE_FILE: "/data/database.sqlite"
      ANALYTICS_ENABLED: "true"
      ANALYTICS_RETENTION_DAYS: "30"
      GEOLITE2_LICENSE_KEY: ""
      WAF_ENABLED: "true"
      WAF_AUTO_BLOCK_THRESHOLD: "0"
      WAF_AUTO_BLOCK_WINDOW_SEC: "300"
      WAF_AUTO_BLOCK_TTL_SEC: "3600"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
